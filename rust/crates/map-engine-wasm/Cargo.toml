[package]
name = "map-engine-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM map rendering engine for fastgis.cc"
repository = "https://github.com/emilianscheel/fastgis.cc"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
map-core = { path = "../map-core" }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "CanvasRenderingContext2d",
  "HtmlCanvasElement",
  "OffscreenCanvas",
  "OffscreenCanvasRenderingContext2d",
  "ImageBitmap",
] }
